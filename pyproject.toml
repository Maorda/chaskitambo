[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chaskitambo"
version = "0.1.0"
description = "Motor centralizador de plugins de raspado autónomo para chaskywasi"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tu Nombre", email = "tu.correo@example.com" }
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9.0",
    "loguru>=0.7.0",
    "httpx>=0.24.0"
]

[project.scripts]
chaskitambo = "chaskitambo.cli:app"

[tool.setuptools.packages.find]
where = ["src"]